<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="module" src="src/app.js"></script>
</head>

<body class="text-gray-800 dark:text-gray-100 min-h-screen">

  <!-- App Header -->
  <header class="border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-semibold">Smart Task Manager</h1>

      <!-- Dark mode toggle (JS later) -->
      <button
        id="theme-toggle"
        class="text-sm px-3 py-1 rounded border border-gray-300 dark:border-gray-600"
      >
        Toggle Theme
      </button>
    </div>
  </header>

  <!-- Main App -->
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Input Section -->
    <section
      aria-labelledby="task-input-title"
      class="bg-white dark:bg-gray-800 p-4 rounded shadow"
    >
      <h2 id="task-input-title" class="font-medium mb-4">
        Add New Task
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- Title -->
        <div class="md:col-span-2">
          <label for="task-title" class="block text-sm mb-1">
            Task Title
          </label>
          <input
            id="task-title"
            type="text"
            placeholder="Enter task title"
            class="w-full px-3 py-2 rounded border dark:bg-gray-700 dark:border-gray-600"
          />
        </div>

        <!-- Priority -->
        <div>
          <label for="task-priority" class="block text-sm mb-1">
            Priority
          </label>
          <select
            id="task-priority"
            class="w-full px-3 py-2 rounded border dark:bg-gray-700 dark:border-gray-600"
          >
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <!-- Due Date -->
        <div>
          <label for="task-date" class="block text-sm mb-1">
            Due Date
          </label>
          <input
            id="task-date"
            type="date"
            class="w-full px-3 py-2 rounded border dark:bg-gray-700 dark:border-gray-600"
          />
        </div>
      </div>

      <div class="mt-4 flex justify-end">
        <button
          id="add-task-btn"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          Add Task
        </button>
      </div>
    </section>

    <!-- Filter Section -->
    <section
      aria-labelledby="task-filter-title"
      class="bg-white dark:bg-gray-800 p-4 rounded shadow"
    >
      <h2 id="task-filter-title" class="font-medium mb-4">
        Filters
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Search -->
        <div>
          <label for="search-input" class="block text-sm mb-1">
            Search
          </label>
          <input
            id="search-input"
            type="text"
            placeholder="Search tasks..."
            class="w-full px-3 py-2 rounded border dark:bg-gray-700 dark:border-gray-600"
          />
        </div>

        <!-- Status Filter -->
        <div>
          <label for="status-filter" class="block text-sm mb-1">
            Status
          </label>
          <select
            id="status-filter"
            class="w-full px-3 py-2 rounded border dark:bg-gray-700 dark:border-gray-600"
          >
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <!-- Priority Filter -->
        <div>
          <label for="priority-filter" class="block text-sm mb-1">
            Priority
          </label>
          <select
            id="priority-filter"
            class="w-full px-3 py-2 rounded border dark:bg-gray-700 dark:border-gray-600"
          >
            <option value="all">All</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Task List Section -->
    <section
      aria-labelledby="task-list-title"
      class="bg-white dark:bg-gray-800 p-4 rounded shadow"
    >
      <h2 id="task-list-title" class="font-medium mb-4">
        Tasks
      </h2>

      <!-- JS will inject tasks here -->
      <ul
        id="task-list"
        class="space-y-2"
      ></ul>
    </section>

  </main>

  <!-- JS entry -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
